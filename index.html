<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма регистрации — учебный проект</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h1>Регистрация</h1>
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" placeholder="+79991234567"
               inputmode="tel" autocomplete="tel"
               aria-describedby="phoneHint phoneError">
        <span class="hint" id="phoneHint">Формат: +7 и 10 цифр</span>
        <span class="error" id="phoneError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="Придумайте надёжный пароль"
                 autocomplete="new-password" aria-describedby="passwordRules passwordError">
          <button type="button" class="toggle-password" data-target="password" aria-label="Показать пароль" aria-pressed="false" title="Показать пароль">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <div class="strength-meter" aria-hidden="true">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <span class="strength-label" id="strengthLabel" aria-live="polite"></span>
        <ul class="password-rules" id="passwordRules">
          <li data-rule="length">Не менее 8 символов</li>
          <li data-rule="lower">Строчная буква</li>
          <li data-rule="upper">Заглавная буква</li>
          <li data-rule="digit">Цифра</li>
          <li data-rule="special">Спецсимвол (!@#…)</li>
          <li data-rule="noSpaces">Без пробелов</li>
        </ul>
        <span class="error" id="passwordError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">Повторите пароль</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль"
                 autocomplete="new-password" aria-describedby="confirmError">
          <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Показать пароль" aria-pressed="false" title="Показать пароль">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
        <span class="error" id="confirmError" aria-live="polite"></span>
      </div>

      <button type="submit" id="submitBtn">Зарегистрироваться</button>
      <div class="success" id="successMessage" role="status" aria-live="polite"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
