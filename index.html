<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма регистрации — учебный проект</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <div class="camera-icon" aria-hidden="true"><span></span></div>
    <div class="wordmark">Instagram</div>
    <h1>Создайте аккаунт</h1>
    <p class="intro">Регистрируйтесь, чтобы делиться моментами<br>и быть ближе к тем, кто вам дорог.</p>
    <div class="divider"><span>РЕГИСТРАЦИЯ</span></div>
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="phone">Телефон</label>
        <input type="text" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="+79991234567">
        <span class="error" id="phoneError"></span>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Минимум 8 символов">
        <div class="strength-meter">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <span class="strength-label" id="strengthLabel"></span>
        <span class="error" id="passwordError"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">Повторите пароль</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Повторите пароль">
        <span class="error" id="confirmError"></span>
      </div>

      <button type="submit" id="submitBtn">Зарегистрироваться</button>
      <div class="success" id="successMessage"></div>
    </form>
    <p class="footer-note">Каждый момент — начало новой истории.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
